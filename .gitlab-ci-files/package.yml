rocky8-package:
  needs:
    - prepare-package
  extends: .package
  image: gitlab.linphone.org:4567/bc/public/docker/rocky8-php:$ROCKY_8_IMAGE_VERSION
  script:
    - make package-el8

rocky9-package:
  needs:
    - prepare-package
  extends: .package
  image: gitlab.linphone.org:4567/bc/public/docker/rocky9-php:$ROCKY_9_IMAGE_VERSION
  script:
    - make package-el9

rocky10-package:
  needs:
    - prepare-package
  extends: .package
  image: gitlab.linphone.org:4567/bc/public/docker/rocky10-php:$ROCKY_10_IMAGE_VERSION
  script:
    - make package-el10

debian12-package:
  needs:
    - prepare-package
  extends: .debian_package
  image: gitlab.linphone.org:4567/bc/public/docker/debian12-php:$DEBIAN_12_IMAGE_VERSION

debian13-package:
  needs:
    - prepare-package
  extends: .debian_package
  image: gitlab.linphone.org:4567/bc/public/docker/debian13-php:$DEBIAN_13_IMAGE_VERSION

.debian_package:
  extends: .package
  script:
    - make package-deb

.package:
  tags: ["docker-fam"]

  stage: package
  artifacts:
    paths:
      - build/*
    when: always
    expire_in: 1 day

  variables:
    COMPOSER_CACHE_DIR: $CI_PROJECT_DIR/.composer/cache
    COMPOSER_ALLOW_SUPERUSER: 1

  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - flexiapi/vendor/
      - .composer/cache
